<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FinTrack Personal</title>
<meta name="theme-color" content="#4f46e5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FinTrack">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="FinTrack">
<meta name="description" content="Catat pemasukan, pengeluaran, dan target tabungan. Bisa dipakai offline.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#f1f4fb;--card:#fff;--ink:#0e1a3b;--mute:#64729a;--line:#e3e8f4;--soft:#eef2ff;
 --b1:#2563eb;--b2:#4f46e5;--b3:#8b5cf6;--grad:linear-gradient(135deg,#2563eb 0%,#4f46e5 52%,#8b5cf6 100%);
 --in:#0891b2;--out:#e11d48;--yel:#f59e0b;--grey:#dfe5f3;--pinv:#fff;--ring:rgba(79,70,229,.28);color-scheme:light;
 --sh1:0 1px 2px rgba(20,40,110,.05),0 6px 20px rgba(20,40,110,.07);
 --sh2:0 2px 4px rgba(20,40,110,.06),0 18px 44px rgba(37,50,160,.16);
 --shb:0 6px 18px rgba(79,70,229,.35);
}
[data-theme=dark]{
 --bg:#070d1d;--card:#0e1730;--ink:#e8edfc;--mute:#8d9bc6;--line:#1b2748;--soft:#15213f;
 --grad:linear-gradient(135deg,#3b82f6 0%,#6366f1 52%,#a78bfa 100%);
 --in:#22d3ee;--out:#fb7185;--yel:#fbbf24;--grey:#26335a;--pinv:#fff;--ring:rgba(129,140,248,.35);color-scheme:dark;
 --sh1:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
 --sh2:0 2px 4px rgba(0,0,0,.4),0 20px 50px rgba(0,0,0,.5);
 --shb:0 6px 20px rgba(99,102,241,.45);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1;background:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(900px 420px at 88% -8%,rgba(99,102,241,.16),transparent 62%),radial-gradient(760px 420px at -6% 0,rgba(37,99,235,.12),transparent 60%),var(--bg)}
a{color:var(--b1);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.ic{display:block;flex-shrink:0}
.shell{display:flex;min-height:100vh}
.side{width:240px;padding:22px 16px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(10px);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;flex-shrink:0}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 26px}
.brand .bt{font-family:Poppins,Inter,system-ui,sans-serif;font-weight:500;font-size:18px;letter-spacing:-.015em;line-height:1.1;white-space:nowrap}
.brand em{font-style:normal;font-weight:400;color:var(--mute)}
.logo{width:38px;height:38px;flex-shrink:0;display:block;filter:drop-shadow(0 6px 12px rgba(79,70,229,.30))}
.logo svg{display:block;width:100%;height:100%}
.trow{display:flex;align-items:center;gap:9px}
.mlogo{display:none}
/* di HP menu samping disembunyikan, jadi logo tampil di judul Dashboard */
@media(max-width:820px){body[data-pg=dash] .mlogo{display:block;width:30px;height:30px;filter:drop-shadow(0 4px 8px rgba(79,70,229,.28))}}
.nl{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:12px;color:var(--mute);font-weight:500;margin-bottom:4px;transition:background .2s,color .2s}
.nl:hover{background:var(--soft);color:var(--ink)}
.nl.on{background:var(--grad);color:#fff;box-shadow:var(--shb)}
.mainc{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:26px 28px 0;max-width:1120px;margin:0 auto}
.top h1{font-size:26px;margin:0;letter-spacing:-.03em;line-height:1.2}
.sub{color:var(--mute);font-size:13.5px;margin-top:2px}
.ib{border:1px solid var(--line);background:var(--card);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;box-shadow:var(--sh1);color:var(--ink)}
.ib2{border:1px solid var(--line);background:var(--card);border-radius:9px;width:32px;height:32px;display:inline-grid;place-items:center;color:var(--mute);transition:color .2s,box-shadow .2s}
.ib2:hover{color:var(--b2);box-shadow:var(--sh1)}.ib2.d:hover{color:var(--out)}
main{max-width:1120px;margin:0 auto;padding:22px 28px 100px}
.bottom{display:none}
.grid{display:grid;gap:18px}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--sh1)}
.card h3{margin:0 0 14px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.stat .l{color:var(--mute);font-size:13px}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:2px}
.in{color:var(--in)}.out{color:var(--out)}.neg{color:var(--out)}.mute{color:var(--mute);font-size:13px}
.hero{position:relative;overflow:hidden;background:var(--grad);color:#fff;border:0;box-shadow:var(--sh2);border-radius:24px;padding:26px}
.hero::before{content:"";position:absolute;width:360px;height:360px;right:-100px;top:-160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 66%)}
.hero::after{content:"";position:absolute;width:300px;height:300px;left:-90px;bottom:-190px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.35),transparent 66%)}
.hero>*{position:relative;z-index:1}
.hero .l{opacity:.85;font-size:13.5px}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-.04em;line-height:1.15;margin:2px 0 4px}
.hero .mute{color:rgba(255,255,255,.78)}
.hp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:20px}
.hp div{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:12px 14px;backdrop-filter:blur(6px)}
.hp span{display:block;font-size:12px;opacity:.82}
.hp b{font-size:17px;letter-spacing:-.02em}
.bar2{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.bar2 h2{margin:0;font-size:18px;letter-spacing:-.02em}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--grad);color:var(--pinv);border:0;border-radius:12px;padding:11px 18px;font-weight:600;box-shadow:var(--shb);transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(79,70,229,.4)}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh1)}
.btn.del{background:var(--card);color:var(--out);border:1px solid var(--line);box-shadow:none}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:10px}
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--b2);outline-offset:2px}
label{display:block;font-size:13px;font-weight:500;color:var(--mute);margin:14px 0 6px}
input,select{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{outline:none;border-color:var(--b2);box-shadow:0 0 0 4px var(--ring)}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.mnav{display:flex;align-items:center;gap:10px;font-weight:600;text-transform:capitalize;letter-spacing:-.01em}
.mnav button{border:1px solid var(--line);background:var(--card);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;box-shadow:var(--sh1)}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 14px;font-weight:500;color:var(--mute);transition:all .2s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh1)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid var(--card);padding:0;box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2.5px var(--ink)}
.li{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0;padding-bottom:0}
.li:first-of-type{padding-top:0}
.grow{flex:1;min-width:0}
.av{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;font-weight:600;color:#fff;font-size:16px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 55%,#a78bfa));box-shadow:0 5px 12px color-mix(in srgb,var(--c) 32%,transparent)}
.empty{color:var(--mute);text-align:center;padding:26px 8px}
.prog{height:9px;background:var(--soft);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gc,var(--b1)),color-mix(in srgb,var(--gc,var(--b1)) 50%,#a78bfa));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.goal{transition:transform .2s,box-shadow .25s}
.goal:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.goal .gh{display:flex;gap:14px;align-items:center}
.amt{font-size:24px;font-weight:700;margin-top:14px;letter-spacing:-.03em}
.amt small{font-size:13px;font-weight:400;color:var(--mute);letter-spacing:0}
.tag{background:var(--soft);color:var(--b2);border-radius:99px;padding:3px 11px;font-size:12px;font-weight:600;white-space:nowrap}
[data-theme=dark] .tag{color:#a5b4fc}
.rec{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 8px}
.rec div{background:var(--soft);border-radius:13px;padding:10px 6px;text-align:center}
.rec b{display:block;font-size:13px;letter-spacing:-.01em}.rec span{font-size:11px;color:var(--mute)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chrow{display:flex;gap:14px;align-items:center;padding:12px 8px;margin:0 -8px;border-radius:14px;position:relative}
.chk{width:34px;height:34px;border-radius:50%;border:2px solid var(--grey);background:transparent;display:grid;place-items:center;color:#fff;flex-shrink:0;padding:0;transition:all .2s}
.chk.on{background:var(--grad);border-color:transparent;box-shadow:var(--shb)}
.fresh .chk{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
.fresh{animation:flash 1.1s ease-out}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes flash{0%{background:var(--soft)}100%{background:transparent}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px 6px;justify-items:center}
.cal>*{width:100%;max-width:56px}
.cal .h{text-align:center;font-size:11px;color:var(--mute);padding:2px 0 2px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.mc{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:50%;background:var(--card);padding:0;font-size:12.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:box-shadow .2s,border-color .2s,transform .15s}
.mc:hover{box-shadow:var(--sh1);border-color:var(--b2);transform:scale(1.05)}
.mc.today{border-color:var(--b2);box-shadow:0 0 0 2px var(--b2)}
.cd.today::before{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--b2);pointer-events:none}
.dots{display:flex;gap:3px;height:5px}
.dt{width:5px;height:5px;border-radius:50%}
.cd{position:relative;aspect-ratio:1;border:0;border-radius:50%;font-weight:600;font-size:14px;padding:0;color:var(--ink);background:var(--grey);transition:transform .15s,box-shadow .2s}
.cd:hover{transform:scale(1.06);box-shadow:var(--sh1);z-index:2}
.cd.full{background:linear-gradient(135deg,#34d399,#059669);color:#fff;box-shadow:0 4px 10px rgba(5,150,105,.3)}
.cd.part{background:linear-gradient(135deg,#fde047,#f59e0b);color:#3b2a00;box-shadow:0 4px 10px rgba(245,158,11,.3)}
.cd.miss{background:linear-gradient(135deg,#fb7185,#e11d48);color:#fff;box-shadow:0 4px 10px rgba(225,29,72,.3)}
.cd.wait{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.cd.out{background:transparent;color:var(--mute);border:1px dashed var(--line);font-weight:400}
.cd.today.wait{background:var(--card)}
.cd[data-tip]:hover::after,.cd[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;bottom:112%;left:50%;transform:translateX(-50%);background:#0e1a3b;color:#fff;padding:6px 11px;border-radius:9px;font-size:12px;font-weight:500;white-space:nowrap;z-index:20;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.28)}
.cd:nth-child(7n+1)::after{left:0!important;transform:none!important}
.cd:nth-child(7n)::after{left:auto!important;right:0;transform:none!important}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px;font-size:12.5px;color:var(--mute)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.cmp{width:100%;border-collapse:collapse}
.cmp td,.cmp th{padding:10px 4px;border-bottom:1px solid var(--line);text-align:right;font-size:14px}
.cmp td:first-child,.cmp th:first-child{text-align:left}
.cmp th{color:var(--mute);font-weight:500;font-size:12px}
.pie{display:flex;gap:22px;flex-wrap:wrap;align-items:center;justify-content:center}
.pl{flex:1;min-width:190px}
.pl div{display:flex;gap:10px;align-items:center;padding:5px 0;font-size:14px}
.pl i{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.ov{position:fixed;inset:0;background:rgba(8,14,40,.5);backdrop-filter:blur(5px);display:grid;place-items:center;padding:16px;z-index:50}
.dlg{background:var(--card);border-radius:22px;padding:22px;width:100%;max-width:450px;max-height:90vh;overflow:auto;border:1px solid var(--line);box-shadow:0 30px 80px rgba(8,14,40,.45)}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.dh h3{margin:0;font-size:18px;letter-spacing:-.02em}
.x{border:0;background:none;color:var(--mute);width:30px;height:30px;display:grid;place-items:center;border-radius:8px}
.x:hover{background:var(--soft)}
.mact{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
.hint{font-size:12px;color:var(--mute);margin-top:8px}
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(8px);background:#0e1a3b;color:#fff;padding:12px 20px;border-radius:14px;opacity:0;pointer-events:none;transition:all .3s;z-index:80;max-width:90vw;text-align:center;box-shadow:0 14px 36px rgba(8,14,40,.4);font-size:14px}
#toast.on{opacity:1;transform:translateX(-50%)}
.pt{position:fixed;pointer-events:none;z-index:90;width:7px;height:7px}
@media(max-width:820px){
 .side{display:none}
 .bottom{display:flex;position:fixed;bottom:12px;left:12px;right:12px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;z-index:40;padding:6px;box-shadow:var(--sh2)}
 .bottom .nl{flex:1;flex-direction:column;gap:3px;font-size:10.5px;padding:8px 2px;margin:0;border-radius:16px;align-items:center}
 main,.top{padding-left:16px;padding-right:16px}
 .top{padding-top:20px}.top h1{font-size:22px}
 .hero .big{font-size:32px}.hero{padding:20px;border-radius:22px}
 #toast{bottom:96px}
 main{padding-bottom:110px}
}

/* ===== Penyempurnaan tata letak ===== */
html.lock{overflow:hidden}
.side{overflow-y:auto}
.top{gap:16px}
.card{padding:22px}
.hero{padding:26px}
.hero .big{font-size:clamp(28px,7vw,40px);overflow-wrap:anywhere}
.stat .v{font-size:clamp(20px,5.2vw,26px);overflow-wrap:anywhere}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(min-width:1180px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{container-type:inline-size}
.stat .v{font-size:clamp(16px,11.5cqw,26px)}
.mnav span{min-width:132px;text-align:center}
.li .grow>b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .grow>.mute{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li>b{white-space:nowrap;text-align:right}
.segw{min-width:min(280px,100%)}
.filebtn{position:relative;overflow:hidden;margin:0;cursor:pointer;font-size:15px}
.filebtn:focus-within{outline:2px solid var(--b2);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;padding:0;border:0}
input:hover,select:hover{border-color:color-mix(in srgb,var(--b2) 40%,var(--line))}
.btn.dng{background:linear-gradient(135deg,#f43f5e,#e11d48);color:#fff;box-shadow:0 6px 18px rgba(225,29,72,.3)}
.ov.top2{z-index:70}
.dlg.sm{max-width:380px}
.cmsg{margin:6px 0 4px;font-size:15px;line-height:1.6}
.cd[data-tip]:hover::after,.cd[data-tip]:focus-visible::after{border:1px solid rgba(255,255,255,.12)}
@media(max-width:560px){
 .g4,.g3{grid-template-columns:1fr 1fr}
 .g4>.hero,.g4>.stat:last-child,.g3>.stat:last-child{grid-column:1/-1}
 .card{padding:18px;border-radius:18px}
 .hero{padding:20px}
 .hp{grid-template-columns:1fr 1fr}
 .hp b{display:block;overflow-wrap:anywhere}
 .cal{gap:8px 3px}
 .cal>*{max-width:46px}
 .cd{font-size:13px}.mc{font-size:11.5px}
 .cd.today::before{inset:-3px}
 .tools .seg{width:100%}
 .acts .btn{flex:1 1 auto;justify-content:center}
 .mnav span{min-width:112px}
 .li{gap:10px}
 .li .av{width:38px;height:38px;border-radius:12px;font-size:15px}
 .li>b{font-size:14px}
 .li .ib2{width:30px;height:30px}
 .hp b{font-size:15px}
 .hp span{font-size:11.5px}
}

/* ===== Dashboard, sidebar, transisi laman ===== */
.dg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px;align-items:stretch}
.dc{display:flex;flex-direction:column;min-width:0}
.dc .ch{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;min-height:34px}
.dc .ch h3{margin:0}
.dc .cb{flex:1;display:flex;flex-direction:column;min-width:0}
.dc .cb>.empty{margin:auto;padding:20px 8px}
.dc .cb .legend{margin-top:auto;padding-top:16px}
.dc .cb>svg{margin:auto 0}
.more{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:500;color:var(--b2);white-space:nowrap}
.more:hover{text-decoration:underline}
[data-theme=dark] .more{color:#a5b4fc}
.nl{cursor:pointer}
@media(min-width:821px){.side{display:flex;flex-direction:column}}
#view.enter>*{animation:vin .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(min-width:821px) and (max-width:1100px){
 .side{width:78px;padding:22px 12px}
 .side .bt,.side .nl span{display:none}
 .side .brand{justify-content:center;padding:2px 0 22px}
 .side .nl{justify-content:center;padding:13px 0}
}
@media(max-width:900px){.dg{grid-template-columns:minmax(0,1fr)}}

/* ===== Mobile & peringatan ===== */
.notice{display:flex;gap:14px;align-items:center;justify-content:space-between;background:color-mix(in srgb,#f59e0b 14%,var(--card));border:1px solid color-mix(in srgb,#f59e0b 45%,var(--line));border-radius:16px;padding:14px 16px;font-size:13.5px;line-height:1.55;margin-bottom:16px}
.dc .ch{flex-wrap:nowrap}

@keyframes dlgin{from{opacity:0;transform:translateY(14px) scale(.96)}}

function seed(){

function normalize(d){const r=normalize0(d);if((+d.v||1)<2)ensureDefaults(r.cats);r.v=2;return r}
function normalize0(d){
 const A=x=>Array.isArray(x)?x:[];const N=x=>Math.max(0,Math.round(+x||0));const D=x=>/^\d{4}-\d\d-\d\d$/.test(x);
 return{
  cats:A(d.cats).filter(c=>c&&c.id&&c.nama).map(c=>{let j=c.jenis;if(j!=='masuk'&&j!=='keluar'&&j!=='semua'){const us=new Set(A(d.tx).filter(t=>t&&String(t.categoryId)===String(c.id)).map(t=>t.tipe==='masuk'?'masuk':'keluar'));j=us.size>1?'semua':us.size===1?[...us][0]:(['gaji','bonus','usaha'].includes(String(c.nama).toLowerCase())?'masuk':'keluar')}return{id:String(c.id),nama:String(c.nama).slice(0,30),icon:CI[c.icon]?String(c.icon):'',warna:sc(c.warna),jenis:j}}),
  tx:A(d.tx).filter(t=>t&&t.id&&D(t.tanggal)).map(t=>({id:String(t.id),tipe:t.tipe==='masuk'?'masuk':'keluar',nominal:N(t.nominal),categoryId:t.categoryId?String(t.categoryId):'',catatan:String(t.catatan||'').slice(0,100),tanggal:t.tanggal})),
  goals:A(d.goals).filter(g=>g&&g.id&&g.nama&&D(g.deadline)).map(g=>({id:String(g.id),nama:String(g.nama).slice(0,50),targetAmount:Math.max(1,N(g.targetAmount)),startAmount:N(g.startAmount),deadline:g.deadline,createdAt:D(g.createdAt)?g.createdAt:today(),icon:'',warna:sc(g.warna)})),
  logs:A(d.logs).filter(l=>l&&l.id&&l.goalId&&D(l.tanggal)).map(l=>({id:String(l.id),goalId:String(l.goalId),nominal:N(l.nominal),tanggal:l.tanggal,catatan:String(l.catatan||'').slice(0,100)})).filter(l=>l.nominal>0),
  theme:d.theme==='dark'||d.theme==='light'?d.theme:null};
}

const logAt=(g,d)=>S.logs.find(l=>l.goalId===g.id&&l.tanggal===d);
const cur=g=>g.startAmount+sum(S.logs.filter(l=>l.goalId===g.id).map(l=>l.nominal));
const totalDays=g=>Math.max(1,diffDays(g.createdAt,g.deadline)+1);
const daily=g=>Math.max(1,Math.ceil((g.targetAmount-g.startAmount)/totalDays(g)));
function rec(g){
 const sisa=Math.max(0,g.targetAmount-cur(g)),left=Math.max(1,diffDays(today(),g.deadline)+1);
 return{sisa,left,day:Math.ceil(sisa/left),week:Math.ceil(sisa/Math.max(1,Math.ceil(left/7))),month:Math.ceil(sisa/Math.max(1,Math.ceil(left/30)))};
}
function status(g,d){
 const l=logAt(g,d),n=l?l.nominal:0;
 if(n>=daily(g))return'full';
 if(n>0)return'part';
 if(d<g.createdAt||d>g.deadline)return'out';
 return d<today()?'miss':'wait';
}
function streak(g){
 let d=today();if(status(g,d)!=='full')d=addDays(d,-1);

}
function setLog(gid,date,nominal,note,add){

}

function burst(el){
 if(!el||!el.getBoundingClientRect||!el.animate)return;
 if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const r=el.getBoundingClientRect(),x=r.left+34,y=r.top+r.height/2,cl=['#2563eb','#4f46e5','#8b5cf6','#22d3ee'];
 for(let i=0;i<14;i++){
  const p=document.createElement('span');p.className='pt';p.style.left=x+'px';p.style.top=y+'px';p.style.background=cl[i%cl.length];p.style.borderRadius='50%';document.body.appendChild(p);
  const a=Math.random()*Math.PI*2,d=55+Math.random()*95;
  const an=p.animate([{transform:'translate(0,0) rotate(0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d-34}px) rotate(${Math.random()*360}deg) scale(.3)`,opacity:0}],{duration:750+Math.random()*400,easing:'cubic-bezier(.2,.8,.3,1)'});
  an.onfinish=()=>p.remove();
 }
}
function calGrid(key,cell){
 const[y,m]=key.split('-').map(Number),off=(new Date(y,m-1,1).getDay()+6)%7,dim=new Date(y,m,0).getDate();
 let h=DAYS.map(d=>`<div class="h">${d}</div>`).join('');
 for(let i=0;i<off;i++)h+='<div></div>';
 for(let d=1;d<=dim;d++)h+=cell(key+'-'+pad(d),d);
 return`<div class="cal">${h}</div>`;
}

function render(){
 const h=ROUTE||'#/';let key='dash',body;
 const gm=h.match(/^#\/target\/([^/?]+)/);
 try{
  if(gm){key='target';body=pGoal(gm[1])}

  else body=pDash();
 }catch(e){console.error(e);body='<div class="card empty">Terjadi kesalahan saat menampilkan halaman ini. Coba muat ulang.</div>'}
 $('#side').innerHTML=`<div class="brand"><span class="logo" role="img" aria-label="Logo FinTrack">${LOGO('s')}</span><span class="bt">FinTrack <em>Personal</em></span></div>`+navHTML(key,false);

 $('#ttl').textContent=TITLES[key];
 document.body.dataset.pg=key;const hl=$('#hLogo');if(hl&&!hl.firstChild)hl.innerHTML=LOGO('h');
 $('#sub').textContent=key==='dash'?new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):(gm?'Detail target dan kalender nabung':SUBS[key]);
 const v=$('#view'),ent=ENTER,ns=[ST.dashM,ST.gM,ST.txM,ST.lapM,ST.txP,ST.txD,ST.txY].join('|'),chg=ns!==SIG;
 SIG=ns;ENTER=false;
 v.classList.toggle('enter',ent);v.classList.toggle('mchg',chg&&!ent);
 v.innerHTML=(LS?'':NOTICE())+body;
 if(ent){stagger();reveal()}
 if(ent||chg){calIdx();countUp()}
 $('#themeBtn').innerHTML=ico(curTheme()==='dark'?'sun':'moon',19);$('#tourBtn').innerHTML=ico('help',19);$('#bugBtn').innerHTML=ico('bug',19);

}
function curTheme(){return S.theme||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function applyTheme(){document.documentElement.setAttribute('data-theme',curTheme())}

/* ===== Dashboard ===== */
function pDash(){
 const m=mk(today()),st=mstats(m);
 const bal=sumT(S.tx,'masuk')-sumT(S.tx,'keluar')-sum(S.logs.map(l=>l.nominal));
 const best=Math.max(0,...S.goals.map(streak));
 const months=[];for(let k=5;k>=0;k--)months.push(addMonth(m,-k));
 const data=months.map(k=>({l:monthShort(k),...mstats(k)}));
 const mx=Math.max(1,...data.flatMap(d=>[d.in,d.out]));
 const grid=[0,1,2,3].map(i=>`<line x1="0" x2="360" y1="${12+i*36}" y2="${12+i*36}" stroke="var(--line)" stroke-width="1"/>`).join('');
 const chart=`<svg viewBox="0 0 360 160" width="100%" role="img" aria-label="Grafik cashflow 6 bulan"><defs><linearGradient id="gi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2563eb"/></linearGradient><linearGradient id="go" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>${grid}${data.map((d,i)=>{const x=i*58+13,hi=d.in/mx*108,ho=d.out/mx*108;return`<rect class="gb" style="--k:${i}" x="${x}" y="${120-hi}" width="20" height="${hi}" rx="5" fill="url(#gi)"><title>${monthLabel(months[i])}: pemasukan ${rp(d.in)}</title></rect><rect class="gb" style="--k:${i}" x="${x+23}" y="${120-ho}" width="20" height="${ho}" rx="5" fill="url(#go)"><title>${monthLabel(months[i])}: pengeluaran ${rp(d.out)}</title></rect><text x="${x+21}" y="142" font-size="11" text-anchor="middle" fill="var(--mute)">${d.l}</text>`}).join('')}</svg><div class="legend"><span><i style="background:linear-gradient(135deg,#22d3ee,#2563eb)"></i>Pemasukan</span><span><i style="background:linear-gradient(135deg,#f472b6,#8b5cf6)"></i>Pengeluaran</span></div>`;
 const mini=calGrid(ST.dashM,(k,d)=>{
  const hasT=S.tx.some(t=>t.tanggal===k),hasL=S.logs.some(l=>l.tanggal===k);
  return`<button class="mc ${k===today()?'today':''}" onclick="dayModal('${k}')" aria-label="${fmtDate(k)}"><span>${d}</span><span class="dots">${hasT?'<i class="dt" style="background:#2563eb"></i>':''}${hasL?'<i class="dt" style="background:#8b5cf6"></i>':''}</span></button>`});
 const more=(h,t)=>`<a class="more" href="${h}">${t} ${ico('chevR',14)}</a>`;
 const recent=S.tx.length?S.tx.slice().sort((a,b)=>b.tanggal.localeCompare(a.tanggal)||b.id.localeCompare(a.id)).slice(0,6).map(t=>txRow(t)).join(''):'<div class="empty">Belum ada transaksi.<br><a href="#/transaksi">Catat transaksi pertama</a></div>';
 const hasData=data.some(d=>d.in||d.out);
 return`<div class="card hero"><div class="l">Saldo saat ini</div><div class="big">${rp(bal)}</div><div class="mute">sudah dikurangi tabungan</div>
 <div class="hp"><div><span>Pemasukan bulan ini</span><b>${rp(st.in)}</b></div><div><span>Pengeluaran bulan ini</span><b>${rp(st.out)}</b></div><div><span>Ditabung bulan ini</span><b>${rp(st.sv)}</b></div><div><span>Streak aktif</span><b>${best} hari</b></div></div></div>
 <div class="dg">
 <section class="card dc"><div class="ch"><h3>Checklist nabung hari ini</h3>${more('#/target','Semua target')}</div><div class="cb">${checklist()}</div></section>
 <section class="card dc"><div class="ch"><h3>Cashflow 6 bulan</h3>${more('#/laporan','Laporan')}</div><div class="cb">${hasData?chart:'<div class="empty">Belum ada data pemasukan atau pengeluaran.<br><a href="#/transaksi">Catat transaksi</a></div>'}</div></section>
 <section class="card dc"><div class="ch"><h3>Kalender</h3>${mnav('dashM')}</div><div class="cb">${mini}<div class="legend"><span><i style="background:#2563eb"></i>Ada transaksi</span><span><i style="background:#8b5cf6"></i>Ada tabungan</span></div></div></section>
 <section class="card dc"><div class="ch"><h3>Transaksi terbaru</h3>${more('#/transaksi','Lihat semua')}</div><div class="cb">${recent}</div></section>
 </div>`;
}
function checklist(){
 const t=today();
 const gs=S.goals.filter(g=>t>=g.createdAt&&t<=g.deadline&&(cur(g)<g.targetAmount||logAt(g,t)));
 if(!gs.length)return`<div class="empty">${S.goals.length?'Tidak ada target aktif hari ini.':'Belum ada target nabung.<br><a href="#/target">Buat target pertama</a>'}</div>`;
 return gs.map(g=>{
  const l=logAt(g,t),sk=streak(g),tg=Math.min(daily(g),Math.max(1,g.targetAmount-cur(g)));
  return`<div class="chrow ${l&&fx===g.id?'fresh':''}" data-g="${g.id}"><button class="chk ${l?'on':''}" onclick="${l?`uncheck('${g.id}')`:`logModal('${g.id}','${t}','check')`}" aria-label="${l?'Batalkan centang':'Centang'} ${esc(g.nama)}">${l?ico('check',18):''}</button>${av(g.nama,g.warna)}<div class="grow"><b>${esc(g.nama)}</b><div class="mute">${l?`Hari ini menabung ${rp(l.nominal)}`:`Target harian ${rp(tg)}`}${sk?` · streak ${sk} hari`:''}</div></div>${l?'':`<button class="btn sm" onclick="logModal('${g.id}','${t}','check')">Centang</button>`}</div>`}).join('');
}
function dayModal(d){

 openModal(fmtDate(d),`${ls.length?'<div class="mute" style="margin:10px 0 4px">Tabungan</div>'+ls.map(l=>{const g=S.goals.find(x=>x.id===l.goalId);return`<div class="li">${g?av(g.nama,g.warna):''}<div class="grow">${g?esc(g.nama):'(target dihapus)'}<div class="mute">${esc(l.catatan)}</div></div><b class="in">${rp(l.nominal)}</b></div>`}).join(''):''}${tx.length?'<div class="mute" style="margin:12px 0 4px">Transaksi</div>'+tx.map(t=>txRow(t,true)).join(''):''}${!tx.length&&!ls.length?'<div class="empty">Belum ada catatan di tanggal ini.</div>':''}<div class="mact"><button class="btn" onclick="txForm('','${d}')">${ico('plus',16)} Transaksi</button></div>`);curDay=d;

const fmtDay=s=>parseD(s).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

 const c=catOf(t.categoryId);
 return`<div class="li">${avi(c)}<div class="grow"><b>${esc(c.nama)}</b><div class="mute">${esc(t.catatan)||'Tanpa catatan'}${nd?'':' · '+fmtShort(t.tanggal)}</div></div><b class="${t.tipe==='masuk'?'in':'out'}">${t.tipe==='masuk'?'+':'-'}${rp(t.nominal)}</b><span style="white-space:nowrap;display:flex;gap:6px"><button class="ib2" onclick="txForm('${t.id}')" aria-label="Ubah">${ico('edit',15)}</button><button class="ib2 d" onclick="delTx('${t.id}')" aria-label="Hapus">${ico('trash',15)}</button></span></div>`;

function txInPeriod(t){const p=ST.txP;return p==='all'||(p==='day'?t.tanggal===ST.txD:p==='month'?t.tanggal.startsWith(ST.txM):t.tanggal.startsWith(ST.txY))}
function txFiltered(){
 const q=ST.txQ.trim().toLowerCase();
 return S.tx.filter(t=>txInPeriod(t)&&(!ST.txT||t.tipe===ST.txT)&&(!q||(catOf(t.categoryId).nama+' '+t.catatan+' '+t.nominal).toLowerCase().includes(q))).sort((a,b)=>b.tanggal.localeCompare(a.tanggal)||b.id.localeCompare(a.id));
}
const perLabel=()=>ST.txP==='day'?fmtDate(ST.txD):ST.txP==='month'?monthLabel(ST.txM):ST.txP==='year'?'tahun '+ST.txY:'semua waktu';
function txListHTML(){
 const list=txFiltered(),shown=list.slice(0,ST.txLim);
 if(!list.length)return`<div class="empty">${ST.txQ.trim()?'Tidak ada transaksi yang cocok dengan pencarian.':'Belum ada transaksi di '+esc(perLabel())+'.'}</div>`;
 const tot={};list.forEach(t=>{tot[t.tanggal]=(tot[t.tanggal]||0)+(t.tipe==='masuk'?t.nominal:-t.nominal)});
 let h='',last='';
 shown.forEach(t=>{
  if(ST.txP!=='day'&&t.tanggal!==last){last=t.tanggal;const v=tot[t.tanggal];h+=`<div class="gh2"><span>${fmtDay(t.tanggal)}</span><span class="${v<0?'out':'in'}">${v<0?'-':'+'}${rp(Math.abs(v))}</span></div>`}
  h+=txRow(t,true);
 });
 if(list.length>shown.length)h+=`<div class="morew"><button class="btn alt" onclick="txMore()">Tampilkan lebih banyak (${list.length-shown.length})</button></div>`;

function ensureCat(nama,tipe){

function saveTx(id){

 ST.txM=mk(o.tanggal);ST.txY=o.tanggal.slice(0,4);ST.txD=o.tanggal;ST.txLim=60;

/* ===== Laporan ===== */
let PIE=null;
function pie(items){
 const total=sum(items.map(i=>i.v));if(!total)return'';
 const r=67,C=2*Math.PI*r,gap=items.length>1?2.6:0;let acc=0,sl='';
 PIE={total,sel:null,items:items.map(i=>({n:i.n,v:i.v,p:Math.round(i.v/total*100)}))};
 const defs='<defs>'+[...new Set(items.map(i=>sc(i.c)))].map(c=>`<linearGradient id="pg${c.slice(1)}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="color-mix(in srgb,${c} 55%,#a78bfa)"/></linearGradient>`).join('')+'</defs>';
 items.forEach((it,k)=>{
  const f=it.v/total,len=Math.max(.5,f*C-gap),st=acc*C+gap/2,mid=(acc+f/2)*Math.PI*2-Math.PI/2;
  sl+=`<g class="ps" data-i="${k}" style="--tx:${(Math.cos(mid)*7).toFixed(2)}px;--ty:${(Math.sin(mid)*7).toFixed(2)}px" onmouseenter="pieHover(${k})" onmouseleave="pieOut()" onclick="pieTap(${k})"><circle cx="100" cy="100" r="${r}" fill="none" stroke="url(#pg${sc(it.c).slice(1)})" stroke-width="34" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-st).toFixed(2)}" transform="rotate(-90 100 100)"><title>${esc(it.n)}: ${rp(it.v)}</title></circle></g>`;
  acc+=f;
 });
 const tf=rp(total).length>12?10:12;
 return`<svg class="pchart" viewBox="0 0 200 200" width="210" height="210" role="img" aria-label="Pie chart pengeluaran per kategori">${defs}<mask id="pm" maskUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><circle class="pmask" cx="100" cy="100" r="67" fill="none" stroke="#fff" stroke-width="66" stroke-dasharray="422 422" transform="rotate(-90 100 100)"/></mask><g mask="url(#pm)">${sl}</g><circle cx="100" cy="100" r="48" fill="var(--card)" onclick="pieTap(-1)"/><text id="pcL" x="100" y="92" text-anchor="middle" font-size="11" fill="var(--mute)">Total</text><text id="pcV" data-cu x="100" y="110" text-anchor="middle" font-size="${tf}" font-weight="700" fill="var(--ink)">${rp(total)}</text><text id="pcP" x="100" y="126" text-anchor="middle" font-size="10.5" fill="var(--mute)"></text></svg>`;
}
function pieHover(k){
 if(!PIE||!PIE.items[k])return;
 const it=PIE.items[k],L=$('#pcL'),V=$('#pcV'),P=$('#pcP'),pc=$('.pie');if(!L||!V||!P||!pc)return;
 cuTok++;
 L.textContent=it.n.length>14?it.n.slice(0,13)+'…':it.n;V.textContent=rp(it.v);V.setAttribute('font-size',rp(it.v).length>12?10:13);P.textContent=it.p+'%';
 pc.classList.add('hv');pc.querySelectorAll('[data-i]').forEach(e=>e.classList.toggle('act',+e.dataset.i===k));
}
function pieReset(){
 if(!PIE)return;const L=$('#pcL'),V=$('#pcV'),P=$('#pcP'),pc=$('.pie');if(!L||!V||!P||!pc)return;
 L.textContent='Total';V.textContent=rp(PIE.total);V.setAttribute('font-size',rp(PIE.total).length>12?10:12);P.textContent='';
 pc.classList.remove('hv');pc.querySelectorAll('[data-i]').forEach(e=>e.classList.remove('act'));
}
function pieOut(){if(!PIE)return;if(PIE.sel!=null)pieHover(PIE.sel);else pieReset()}
function pieTap(k){if(!PIE)return;if(k<0||PIE.sel===k){PIE.sel=null;pieReset()}else{PIE.sel=k;pieHover(k)}}
function byCat(m){const o={};S.tx.filter(t=>t.tipe==='keluar'&&t.tanggal.startsWith(m)).forEach(t=>o[t.categoryId]=(o[t.categoryId]||0)+t.nominal);return o}
function dl2(a,b,bad){if(!b)return a?'<span class="mute">baru</span>':'<span class="mute">—</span>';const p=Math.round((a-b)/b*100),w=bad?p>0:p<0;return`<b class="${p===0?'':w?'out':'in'}">${p>0?'+':''}${p}%</b>`}
function pLap(){
 const m=ST.lapM,pm=addMonth(m,-1),a=mstats(m),b=mstats(pm),cc=byCat(m),pc=byCat(pm);
 const items=Object.entries(cc).sort((x,y)=>y[1]-x[1]).map(([id,v])=>({n:catOf(id).nama,c:catOf(id).warna,v}));
 const tot=sum(items.map(i=>i.v));
 const ids=[...new Set([...Object.keys(cc),...Object.keys(pc)])].sort((x,y)=>(cc[y]||0)-(cc[x]||0));
 const rest=a.in-a.out-a.sv;
 const[yy,mm]=m.split('-').map(Number),dim=new Date(yy,mm,0).getDate(),now=today(),el=mk(now)===m?+now.slice(8):(m<mk(now)?dim:0);
 const avg=el?a.out/el:0,cnt=S.tx.filter(t=>t.tanggal.startsWith(m)).length,rate=a.in>0?Math.round((a.in-a.out)/a.in*100):null,top=items[0];
 const pieC=`<div class="card" id="lapPie"><h3>Pengeluaran per kategori</h3>${items.length?`<div class="pie">${pie(items)}<div class="pl">${items.map((i,k)=>`<div data-i="${k}" onmouseenter="pieHover(${k})" onmouseleave="pieOut()" onclick="pieTap(${k})"><i style="background:linear-gradient(135deg,${sc(i.c)},color-mix(in srgb,${sc(i.c)} 55%,#a78bfa))"></i><span class="grow">${esc(i.n)}<small>${rp(i.v)}</small></span><b>${Math.round(i.v/tot*100)}%</b></div>`).join('')}</div></div>`:'<div class="empty">Belum ada pengeluaran di bulan ini.</div>'}</div>`;
 const insC=`<div class="card"><h3>Ringkasan bulan ini</h3><div class="kv"><div><span>Pengeluaran terbesar</span><b>${top?esc(top.n)+' · '+rp(top.v):'—'}</b></div><div><span>Rata-rata pengeluaran per hari</span><b>${rp(avg)}</b></div><div><span>Jumlah transaksi</span><b>${cnt}</b></div><div><span>Sisa dari pemasukan</span><b class="${rate!==null&&rate<0?'out':''}">${rate===null?'—':rate+'%'}</b></div></div></div>`;
 const cmpC=`<div class="card"><h3>${monthLabel(m)} vs ${monthLabel(pm)}</h3><table class="cmp"><tr><th></th><th>Bulan ini</th><th>Bulan lalu</th><th>Selisih</th></tr>
 <tr><td>Pemasukan</td><td>${rp(a.in)}</td><td>${rp(b.in)}</td><td>${dl2(a.in,b.in,false)}</td></tr>
 <tr><td>Pengeluaran</td><td>${rp(a.out)}</td><td>${rp(b.out)}</td><td>${dl2(a.out,b.out,true)}</td></tr>
 <tr><td>Nabung</td><td>${rp(a.sv)}</td><td>${rp(b.sv)}</td><td>${dl2(a.sv,b.sv,false)}</td></tr></table></div>`;
 const catC=ids.length?`<div class="card"><h3>Per kategori</h3><table class="cmp"><tr><th></th><th>Bulan ini</th><th>Bulan lalu</th><th>Selisih</th></tr>${ids.map(id=>`<tr><td>${esc(catOf(id).nama)}</td><td>${rp(cc[id]||0)}</td><td>${rp(pc[id]||0)}</td><td>${dl2(cc[id]||0,pc[id]||0,true)}</td></tr>`).join('')}</table></div>`:'';
 const hPie=130+(items.length?Math.max(220,items.length*52+10):60),hIns=230,hCmp=250,hCat=ids.length?96+ids.length*43:0;
 const A=Math.abs((hPie+hIns)-(hCmp+hCat)),B=Math.abs((hPie+hCat)-(hCmp+hIns));
 const cols=A<=B?`<div class="col">${pieC}${insC}</div><div class="col">${cmpC}${catC}</div>`:`<div class="col">${pieC}${catC}</div><div class="col">${cmpC}${insC}</div>`;
 return`<div class="bar2">${mnav('lapM')}</div>
 <div class="grid g4"><div class="card hero" style="padding:20px;border-radius:20px"><div class="l">Total nabung bulan ini</div><div class="big" style="font-size:28px">${rp(a.sv)}</div><div class="mute">bulan lalu ${rp(b.sv)}</div></div><div class="card stat"><div class="l">Pemasukan</div><div class="v in">${rp(a.in)}</div></div><div class="card stat"><div class="l">Pengeluaran</div><div class="v out">${rp(a.out)}</div></div><div class="card stat"><div class="l">Sisa (masuk − keluar − nabung)</div><div class="v ${rest<0?'out':''}">${rp(rest)}</div></div></div>
 <div class="cols">${cols}</div>`;
}

 if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
}
function bugType(el){const on=el.classList.contains('on');document.querySelectorAll('#bugT .chp').forEach(b=>b.classList.remove('on'));if(!on)el.classList.add('on');BUG.t=on?'':el.textContent}
function bugClean(){BUG={t:''}}
function bugMsg(){
 const r=ROUTE||'#/',pn=r.startsWith('#/transaksi')?'Transaksi':r.startsWith('#/target')?'Target nabung':r.startsWith('#/laporan')?'Laporan':r.startsWith('#/kategori')?'Kategori':'Dashboard';
 const e=envInfo(),w=new Date().toLocaleString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
 return `*LAPORAN MASALAH FINTRACK PERSONAL*\n\n*Waktu:* ${w}\n*Jenis masalah:* ${BUG.t||'Tidak dipilih'}\n*Terjadi di halaman:* ${pn}\n\n*Cerita pengguna:*\n${($('#f_bug').value||'').trim()}\n\n*Info perangkat (otomatis)*\n- Sistem: ${e.os}\n- Aplikasi browser: ${e.br}\n- Ukuran layar: ${innerWidth} x ${innerHeight}\n- Tampilan: tema ${curTheme()==='dark'?'gelap':'terang'}\n- Penyimpanan data: ${LS?'normal':'diblokir, data bisa hilang saat halaman ditutup'}`;
}
function sendBug(){
 const d=($('#f_bug').value||'').trim();
 if(d.length<5){toast('Ceritakan masalahnya dulu');$('#f_bug').focus();return}
 const url='https://wa.me/'+WA_BUG+'?text='+encodeURIComponent(bugMsg());

function impJSON(el){
 const f=el.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.cats)||!Array.isArray(d.tx)||!Array.isArray(d.goals)||!Array.isArray(d.logs))throw 0;ask('Ganti semua data saat ini dengan isi file ini?','Pulihkan',()=>{S=normalize(d);save();applyTheme();render();toast('Data dipulihkan')},false)}catch(e){toast('File cadangan tidak valid')}};
 r.readAsText(f);el.value='';
}
function resetAll(){ask('Hapus SEMUA data? Tindakan ini tidak bisa dibatalkan.','Hapus semua',()=>{S=seed();save();render();toast('Semua data dihapus')})}

/* ===== Start ===== */
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#tour'))tourEnd();else if($('#cmodal').innerHTML)askNo();else closeModal()}});
window.addEventListener('resize',()=>{if($('#tour'))tourPlace()});
function stagger(){
 const v=$('#view');let i=0;
 [...v.children].forEach(el=>el.style.setProperty('--i',i++));
 v.querySelectorAll('.dg>section,.grid>*,.cols .card').forEach((el,j)=>el.style.setProperty('--i',j+2));
 v.querySelectorAll('.card').forEach(c=>c.querySelectorAll('.li,.chrow').forEach((el,j)=>el.style.setProperty('--r',Math.min(j,9))));
}
function calIdx(){document.querySelectorAll('#view .cal').forEach(c=>[...c.children].forEach((el,j)=>el.style.setProperty('--c',j)))}
function reveal(){
 if(!('IntersectionObserver' in window))return;
 const els=[...document.querySelectorAll('#view .card:not(.hero)')].filter(e=>e.getBoundingClientRect().top>innerHeight*.92);
 if(!els.length)return;
 const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('shown');io.unobserve(en.target)}}),{threshold:.06});
 els.forEach(e=>{e.classList.add('rv');io.observe(e)});
 setTimeout(()=>els.forEach(e=>e.classList.add('shown')),6000);
}
function countUp(){
 if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 const tok=++cuTok,jobs=[];
 document.querySelectorAll('#view .big,#view .hp b,#view .stat .v,#view [data-cu]').forEach(el=>{
  const txt=el.textContent,m=/^(-?Rp\s|)([\d.]+)(\shari|)$/.exec(txt.trim());if(!m)return;
  const target=parseInt(m[2].replace(/\./g,''),10);if(!target)return;
  jobs.push({el,txt,target,f:v=>m[1]+Math.round(v).toLocaleString('id-ID')+m[3]});
 });
 if(!jobs.length)return;
 const t0=performance.now(),D=950;
 const step=now=>{
  if(tok!==cuTok)return;
  const p=Math.min(1,(now-t0)/D),e=1-Math.pow(1-p,4);
  jobs.forEach(j=>{if(j.el.isConnected)j.el.textContent=p<1?j.f(j.target*e):j.txt});
  if(p<1)requestAnimationFrame(step);
 };
 requestAnimationFrame(step);
}
document.addEventListener('pointerdown',e=>{
 const b=e.target.closest&&e.target.closest('.btn,.seg button,.ib2,.nl');
 if(!b||b.disabled)return;
 const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height)*1.6,sp=document.createElement('span');
 sp.className='rip';sp.style.width=sp.style.height=d+'px';sp.style.left=(e.clientX-r.left-d/2)+'px';sp.style.top=(e.clientY-r.top-d/2)+'px';
 b.appendChild(sp);setTimeout(()=>sp.remove(),700);
});

/* ===== Panduan (tour) ===== */
const tvis=q=>[...document.querySelectorAll(q)].find(e=>e.getClientRects().length);
const TOUR=[
 {t:'Selamat datang di FinTrack',x:'Panduan singkat ini memperkenalkan fitur utama. Anda bisa melewatinya kapan saja dan membukanya lagi lewat tombol tanda tanya di pojok kanan atas, di sebelah tombol laporan masalah dan tombol tema.'},
 {r:'#/',s:()=>tvis('#side')||tvis('#bottom'),t:'Menu navigasi',x:'Pindah antar laman lewat menu ini: Dashboard, Transaksi, Target, Laporan, dan Kategori.'},
 {r:'#/',s:'#tourBtn',t:'Tombol panduan',x:'Tombol tanda tanya di pojok kanan atas membuka panduan ini lagi kapan saja, jadi kamu bisa mengulanginya jika lupa.'},
 {s:'#bugBtn',t:'Laporkan masalah',x:'Menemukan bug atau ada yang tidak berjalan semestinya? Tekan tombol bendera ini, pilih jenis masalah, lalu ceritakan. Laporan dikirim lewat WhatsApp.'},
 {s:'#themeBtn',t:'Tema terang atau gelap',x:'Tombol bulan atau matahari mengganti tampilan menjadi gelap atau terang. Pilihanmu tersimpan.'},
 {r:'#/',s:'#view .hero',t:'Ringkasan saldo',x:'Dashboard menampilkan saldo, pemasukan, pengeluaran, dan tabungan bulan ini sekaligus.'},
 {r:'#/transaksi',s:'#view .bar2 .btn',t:'Catat transaksi',x:'Pilih Pemasukan atau Pengeluaran, isi nominal, lalu pilih jenis yang disertai ikon, misalnya Makan, Internet, atau Skincare. Pilih "Lainnya" untuk membuat jenis baru.'},
 {r:'#/transaksi',s:'#txf',t:'Lihat per hari, bulan, atau tahun',x:'Pakai tombol Hari, Bulan, Tahun, atau Semua di atasnya untuk melihat transaksi di waktu berbeda. Kolom pencarian membantu menemukan jenis atau catatan tertentu.'},
 {r:'#/transaksi',s:'#txlist',t:'Riwayat transaksi',x:'Setiap transaksi punya ikon sesuai jenisnya. Tombol pensil untuk mengubah, tempat sampah untuk menghapus.'},
 {r:'#/target',s:'#view .bar2 .btn',t:'Target nabung',x:'Buat target dan tenggat, lalu centang setiap hari menabung. Kalender lingkaran menandai hari yang berhasil, kurang, atau terlewat.'},
 {r:'#/laporan',s:'#lapPie',t:'Laporan bulanan',x:'Lihat pengeluaran per jenis lewat diagram lingkaran. Arahkan kursor atau ketuk potongannya untuk melihat rincian.'},
 {r:'#/kategori',s:'#katList',t:'Kelola jenis',x:'Tambah, ubah, atau hapus jenis transaksi beserta ikonnya.'},
 {r:'#/kategori',s:'#katBackup',t:'Cadangan dan ekspor',x:'Unduh cadangan secara berkala supaya data aman. Laporan transaksi juga bisa diekspor ke Excel atau PDF yang rapi untuk dicetak.'},
 {t:'Selesai',x:'Silakan mulai mencatat transaksi pertama Anda. Panduan ini bisa dibuka lagi kapan saja lewat tombol tanda tanya.'}
];
let tourI=-1;
function tourStart(){
 closeModal();askNo();
 if(!$('#tour')){const d=document.createElement('div');d.id='tour';d.innerHTML='<div class="tbg"></div><div class="th"></div><div class="tc" role="dialog" aria-modal="true" aria-label="Panduan penggunaan"></div>';document.body.appendChild(d)}
 tourI=0;syncLock();tourShow();
}
function tourEnd(){const d=$('#tour');if(d)d.remove();tourI=-1;try{if(LS)localStorage.setItem('fintrack.tour','1')}catch(e){}syncLock()}
function tourNav(n){const i=tourI+n;if(i<0)return;if(i>=TOUR.length)return tourEnd();tourI=i;tourShow()}
function tourShow(){
 const d=$('#tour');if(!d)return;const st=TOUR[tourI],card=d.querySelector('.tc'),last=tourI===TOUR.length-1;
 card.style.opacity='0';
 card.innerHTML=`<div class="tk">Langkah ${tourI+1} dari ${TOUR.length}</div><h4>${esc(st.t)}</h4><p>${esc(st.x)}</p><div class="tact"><div class="tdots">${TOUR.map((_,i)=>`<i class="${i===tourI?'on':''}"></i>`).join('')}</div>${last?'':'<button class="btn alt sm" onclick="tourEnd()">Lewati</button>'}${tourI>0?'<button class="btn alt sm" onclick="tourNav(-1)">Kembali</button>':''}<button class="btn sm" onclick="tourNav(1)">${last?'Selesai':'Lanjut'}</button></div>`;
 const need=st.r&&ROUTE!==st.r;
 if(need)go(st.r);
 clearTimeout(tourShow.h);tourShow.h=setTimeout(tourPlace,need?850:80);
}
function tourPlace(){
 const d=$('#tour');if(!d||tourI<0)return;
 const st=TOUR[tourI],hole=d.querySelector('.th'),card=d.querySelector('.tc');
 let el=null;if(st.s)el=typeof st.s==='function'?st.s():tvis(st.s);
 const vw=innerWidth,vh=innerHeight,cw=card.offsetWidth,ch=card.offsetHeight,mob=vw<=560,pad=8;
 let cx=(vw-cw)/2,cy=(vh-ch)/2;
 if(el){
  const rv=el.closest('.rv');if(rv)rv.classList.add('shown');
  let r=el.getBoundingClientRect();
  if(r.top<70||r.bottom>vh-90){el.scrollIntoView({block:r.height>vh*.5?'start':'center'});r=el.getBoundingClientRect()}
  const top=Math.max(r.top,10),bot=Math.min(r.bottom,vh-10),h=Math.max(bot-top,24);
  let rad=parseFloat(getComputedStyle(el).borderTopLeftRadius)||12;rad=Math.min(rad+4,28);
  hole.style.cssText=`left:${r.left-pad}px;top:${top-pad}px;width:${r.width+pad*2}px;height:${h+pad*2}px;border-radius:${rad}px`;
  const mid=(top+bot)/2;
  if(mob){cx=(vw-cw)/2;cy=mid>vh*.5?14:vh-ch-96}
  else if(r.right<=300&&vw-r.right-pad>=cw+24){cx=r.right+pad+16;cy=Math.min(Math.max(top-pad,16),vh-ch-16)}
  else if(bot+pad+ch+24<=vh){cy=bot+pad+16;cx=Math.min(Math.max(r.left,16),vw-cw-16)}
  else if(top-pad-ch-24>=0){cy=top-pad-ch-16;cx=Math.min(Math.max(r.left,16),vw-cw-16)}
  else{cx=Math.min(Math.max(r.left,16),vw-cw-16);cy=vh-ch-24}
 }else{hole.style.cssText=`left:${vw/2}px;top:${vh/2}px;width:0;height:0;border-radius:0`}
 card.style.left=cx+'px';card.style.top=cy+'px';card.style.opacity='1';
}
function go(h){
 ROUTE=h||'#/';lastGoal=null;closeModal();askNo();
 try{if(location.hash!==ROUTE)history.pushState(null,'',ROUTE)}catch(e){}
 ENTER=true;window.scrollTo(0,0);render();
}
function sync(){ROUTE=location.hash||'#/';lastGoal=null;closeModal();ENTER=true;window.scrollTo(0,0);render()}
window.addEventListener('hashchange',sync);
window.addEventListener('popstate',sync);
document.addEventListener('click',e=>{
 if(e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey)return;
 const a=e.target.closest&&e.target.closest('a[href^="#/"]');
 if(a){e.preventDefault();go(a.getAttribute('href'))}
});
applyTheme();render();
setTimeout(()=>{try{if(LS&&!localStorage.getItem('fintrack.tour'))tourStart()}catch(e){}},1500);

/* ===== PWA: pasang aplikasi, offline, penyimpanan awet ===== */
(function(){
 const IOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 const standalone=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
 const NK='fintrack.pwa.nanti';let dp=null;
 const snoozed=()=>{try{return Date.now()-Number(localStorage.getItem(NK)||0)<3*864e5}catch(e){return false}};
 const snooze=()=>{try{localStorage.setItem(NK,String(Date.now()))}catch(e){}};
 const box=()=>document.getElementById('pwa');
 const btn=()=>document.getElementById('instBtn');
 function hideCard(){const b=box();if(b)b.innerHTML=''}
 function showCard(ios){
  const b=box();if(!b||standalone())return;
  b.innerHTML='<div class="pwa-card" role="dialog" aria-label="Pasang aplikasi FinTrack"><img src="icons/icon-192.png" alt="" width="48" height="48"><div class="pwa-t"><b>Pasang FinTrack di perangkatmu</b><span>'+
   (ios?'Ketuk tombol Bagikan di Safari, lalu pilih Tambah ke Layar Utama.':'Buka lebih cepat dari layar utama, bisa dipakai tanpa internet, dan data tetap tersimpan.')+
   '</span></div><div class="pwa-a">'+(ios?'<button class="btn sm" id="pwaLater">Mengerti</button>':'<button class="btn sm alt" id="pwaLater">Nanti</button><button class="btn sm" id="pwaGo">Pasang</button>')+'</div></div>';
  const l=document.getElementById('pwaLater'),g=document.getElementById('pwaGo');
  if(l)l.onclick=()=>{snooze();hideCard()};
  if(g)g.onclick=()=>pwaInstall();
 }
 function whenFree(fn,n){if(n===undefined)n=8;if(document.getElementById('tour')&&n>0){setTimeout(()=>whenFree(fn,n-1),3000)}else fn()}
 window.pwaInstall=async function(){
  if(dp){
   hideCard();
   try{dp.prompt();const r=await dp.userChoice;if(r&&r.outcome!=='accepted')snooze()}catch(e){}
   dp=null;return;
  }
  if(IOS&&!standalone())showCard(true);
  else toast('Gunakan menu browser lalu pilih Pasang aplikasi atau Tambahkan ke layar utama.');
 };
 window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();dp=e;
  const b=btn();if(b)b.hidden=false;
  if(!snoozed())setTimeout(()=>whenFree(()=>{if(dp)showCard(false)}),2500);
 });
 window.addEventListener('appinstalled',()=>{
  dp=null;hideCard();const b=btn();if(b)b.hidden=true;
  toast('FinTrack berhasil dipasang. Buka dari layar utama.');
  persist();
 });
 if(IOS&&!standalone()){
  const b=btn();if(b)b.hidden=false;
  if(!snoozed())setTimeout(()=>whenFree(()=>showCard(true)),3500);
 }
 if(window.matchMedia)try{matchMedia('(display-mode: standalone)').addEventListener('change',e=>{if(e.matches){hideCard();const b=btn();if(b)b.hidden=true}})}catch(e){}

 /* minta browser menjaga data agar tidak dihapus otomatis saat memori penuh */
 function persist(){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}}
 persist();

 /* pulihkan data dari salinan IndexedDB bila localStorage kosong (mis. dibersihkan browser) */
 try{
  let raw=null;try{raw=LS?localStorage.getItem(KEY):null}catch(e){}
  if(raw){idbPut(raw)}
  else if(LS){
   idbGet().then(v=>{
    if(!v||PWA_DIRTY)return;
    try{const d=JSON.parse(v);if(d&&Array.isArray(d.cats)){S=normalize(d);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}ENTER=true;render();toast('Data dipulihkan dari cadangan otomatis di perangkat ini.')}}catch(e){}
   });
  }
 }catch(e){}

 /* status koneksi */
 window.addEventListener('offline',()=>toast('Kamu sedang offline. Semua fitur tetap jalan dan data tersimpan di perangkat.'));
 window.addEventListener('online',()=>toast('Kembali online.'));

 /* service worker (hanya jalan lewat http/https) */
 if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{
   navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{
     const w=reg.installing;if(!w)return;
     w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)toast('Versi baru sudah diunduh. Tutup lalu buka lagi aplikasinya untuk memakainya.')});
    });
   }).catch(()=>{});
  });
 }
})();
</script>
